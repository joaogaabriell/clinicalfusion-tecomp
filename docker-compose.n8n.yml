# Sobe o n8n para o desafio extra (ver docs/09-integracao-n8n.md).
# Uso:
#   docker compose -f docker-compose.n8n.yml up -d --build
# Interface: http://localhost:5678
services:
  n8n:
    build:
      context: .
      dockerfile: n8n.Dockerfile
    container_name: clinicalfusion-n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    environment:
      - TZ=America/Sao_Paulo
      - N8N_SECURE_COOKIE=false
      # Habilita o modelo "demo" (relatorio SIMULADO, sem chamar API) para o no
      # "Execute Command" poder rodar `--modelo demo` quando nao ha chave de API
      # valida. Ver src/llm/demo_client.py. Remova esta linha para que o
      # pipeline do n8n so aceite modelos reais.
      - CLINICALFUSION_DEMO=1
    volumes:
      # Dados/config do próprio n8n (workflows, credenciais), persistentes entre restarts.
      - n8n_data:/home/node/.n8n
      # Repositório do projeto, para o nó "Execute Command" rodar
      # /opt/venv/bin/python -m src.gerar_relatorio a partir daqui.
      - .:/data/clinicalfusion

volumes:
  n8n_data:
